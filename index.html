<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brett Chelf Portfolio</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(10, 10, 30, 0.85);
      color: #ccd6ff;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(120, 170, 255, 0.4);
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <canvas id="nebulaCanvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; display:block;"></canvas>
  <script>
    const canvas = document.getElementById('nebulaCanvas');
    const ctx = canvas.getContext('2d');

    let centerX, centerY;
    let cloudWidth, cloudHeight;

    let particles = [];
    let backgroundStars = [];
    let projectStars = [];
    let hoveredStar = null;

    let mouseX = -9999;
    let mouseY = -9999;
    const gravityStrength = 18;
    const gravityRadius = 180;

    const particleCount = 7500;
    let time = 0;
    let explosionPeriod = 900;

    function gaussianRandom(mean, stdDev) {
      let u = 1 - Math.random();
      let v = Math.random();
      let z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      return z * stdDev + mean;
    }

    function initNebula() {
      centerX = canvas.width / 2;
      centerY = canvas.height / 2;
      cloudWidth = canvas.width * 0.9;
      cloudHeight = canvas.height * 0.7;

      particles = [];
      backgroundStars = [];
      projectStars = [];

      const projectLinks = [
        'ENVS3100PolishedViz4.html',
        'ENVS3100FinalViz.html',
        'pdfs/GISAspenTransport.pdf',
        'pdfs/CUPollinatorGarden.pdf',
        'pdfs/LAND3103Plan3.pdf'
      ];

      const projectLabels = [
        'Interactive New Zealand Species Map',
        'Colorado Pollinator Network',
        'Aspen Transportation Map',
        'CU Pollinator Garden Plan',
        'CASE Center Mountainside Plan'
      ];

      for (let i = 0; i < particleCount; i++) {
        let x = gaussianRandom(centerX, cloudWidth / 5);
        let y = gaussianRandom(centerY, cloudHeight / 5);
        let dx = (x - centerX) / (cloudWidth / 2);
        let dy = (y - centerY) / (cloudHeight / 2);
        if (dx*dx + dy*dy <= 1) {
          let depth = Math.random();
          particles.push({
            baseAngle: Math.atan2(y - centerY, x - centerX),
            distance: Math.sqrt((x-centerX)**2 + (y-centerY)**2),
            depth: depth,
            radius: depth * 2.5,
            alpha: 0.15 + depth * 0.45,
            turbulenceOffset: Math.random() * 1000,
            orbitSpeed: (0.00015 + Math.random() * 0.0004) * (Math.random() < 0.5 ? 1 : -1),
            orbitRadius: 0.85 + Math.random() * 0.3
          });
        }
      }

      for (let i = 0; i < 120; i++) {
        backgroundStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.3,
          alpha: Math.random() * 0.6
        });
      }

      for (let i = 0; i < 5; i++) {
        let angle = Math.random() * Math.PI * 2;
        let radius = Math.random() * (cloudWidth * 0.25);
        projectStars.push({
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius,
          baseRadius: 8 + Math.random() * 6,
          pulseOffset: Math.random() * 10,
          url: projectLinks[i],
          label: projectLabels[i]
        });
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initNebula();
    }

    function getStarUnderCursor(mx, my) {
      return projectStars.find(star => {
        let dx = mx - star.x;
        let dy = my - star.y;
        return Math.sqrt(dx*dx + dy*dy) < star.baseRadius * 4;
      });
    }

    const tooltip = document.getElementById('tooltip');

    canvas.addEventListener('mousemove', function(e) {
      let rect = canvas.getBoundingClientRect();
      let cx = e.clientX - rect.left;
      let cy = e.clientY - rect.top;
      mouseX = cx;
      mouseY = cy;
      hoveredStar = getStarUnderCursor(cx, cy);
      canvas.style.cursor = hoveredStar ? 'pointer' : 'default';

      if (hoveredStar) {
        tooltip.textContent = hoveredStar.label;
        tooltip.style.opacity = '1';
        tooltip.style.left = (e.clientX + 18) + 'px';
        tooltip.style.top  = (e.clientY - 28) + 'px';
      } else {
        tooltip.style.opacity = '0';
      }
    });

    canvas.addEventListener('click', function(e) {
      let rect = canvas.getBoundingClientRect();
      let clicked = getStarUnderCursor(e.clientX - rect.left, e.clientY - rect.top);
      if (clicked) window.location.href = clicked.url;
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawBlackBackground() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawBackgroundStars() {
      backgroundStars.forEach(s => {
        let blue = 210 + Math.random() * 20;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180,200,' + blue + ',' + (s.alpha * 0.4) + ')';
        ctx.fill();
      });
    }

    function computePulse(t) {
      let cycle = (t % explosionPeriod) / explosionPeriod;
      let sine = Math.sin(cycle * Math.PI);
      let decay = Math.exp(-cycle * 3);
      return sine * decay * 140;
    }

    function drawProjectStars() {
      projectStars.forEach(star => {
        let pulse = Math.sin(time * 0.002 + star.pulseOffset) * 0.3 + 1;
        let isHovered = hoveredStar === star;
        let radius = star.baseRadius * pulse * (isHovered ? 1.5 : 1);
        let glowRadius = radius * 4;

        let glow = ctx.createRadialGradient(
          star.x, star.y, 0,
          star.x, star.y, glowRadius
        );
        glow.addColorStop(0, 'rgba(255,255,255,1)');
        glow.addColorStop(0.3, isHovered ? 'rgba(255,230,100,0.95)' : 'rgba(255,200,150,0.8)');
        glow.addColorStop(0.7, 'rgba(120,170,255,0.3)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.beginPath();
        ctx.arc(star.x, star.y, glowRadius, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
      });
    }

    function drawBrightCore(pulseStrength) {
      const gradient = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, 280 + pulseStrength
      );
      gradient.addColorStop(0, 'rgba(255,255,255,0.95)');
      gradient.addColorStop(0.25, 'rgba(255,210,170,0.35)');
      gradient.addColorStop(0.55, 'rgba(160,120,220,0.25)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 280 + pulseStrength, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      time++;
      let pulseStrength = computePulse(time);

      drawBlackBackground();
      drawBackgroundStars();

      particles.forEach(p => {
        let angle = p.baseAngle + time * p.orbitSpeed;
        let distance = p.distance * p.orbitRadius + pulseStrength * 0.0015;

        let turbX = Math.sin(time * 0.0008 + p.turbulenceOffset) * 18 * (1 - p.depth);
        let turbY = Math.cos(time * 0.0006 + p.turbulenceOffset * 1.3) * 14 * (1 - p.depth);

        let x = centerX + Math.cos(angle) * distance + turbX;
        let y = centerY + Math.sin(angle) * distance + turbY;

        let mdx = mouseX - x;
        let mdy = mouseY - y;
        let mdist = Math.sqrt(mdx*mdx + mdy*mdy);
        if (mdist < gravityRadius && mdist > 0) {
          let force = (1 - mdist / gravityRadius) * gravityStrength;
          x += (mdx / mdist) * force;
          y += (mdy / mdist) * force;
        }

        let normalizedDist = p.distance / (cloudWidth / 2);
        let orangeStrength = Math.max(0, 1 - normalizedDist * 1.3);
        let r = 140 + orangeStrength * 100;
        let g = 110 + orangeStrength * 60;
        let b = 210 - orangeStrength * 80;

        ctx.beginPath();
        ctx.arc(x, y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + p.alpha + ')';
        ctx.fill();
      });

      drawProjectStars();
      drawBrightCore(pulseStrength);

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
